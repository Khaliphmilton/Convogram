name: Repair main build

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message == 'Trigger temporary main build repair'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore buildable main and apply profile isolation
        shell: python
        run: |
          import re
          import subprocess
          from pathlib import Path

          subprocess.run(["git", "checkout", "30a291561db627d1d78aa807afac13b203f23e65", "--", "src/main.jsx"], check=True)
          p = Path("src/main.jsx")
          s = p.read_text(encoding="utf-8")

          if "const [viewedProfile, setViewedProfile]" not in s:
              s = s.replace(
                  '  const [profile, setProfile] = useState(null);',
                  '  const [profile, setProfile] = useState(null);\n  const [viewedProfile, setViewedProfile] = useState(null);',
                  1,
              )

          if "const openAccount =" not in s:
              marker = '  if (booting) return'
              insertion = '''  const openAccount = (account) => {\n    if (!account?.id) return;\n    setViewedProfile({ ...account });\n    setProfileTab("posts");\n    setActive("view-profile");\n  };\n  const openOwnProfile = () => { setViewedProfile(null); setProfileTab("posts"); setActive("profile"); };\n  const openSaved = () => { setViewedProfile(null); setProfileTab("saved"); setActive("profile"); };\n\n'''
              s = s.replace(marker, insertion + marker, 1)

          m = re.search(r'\{active === "profile" && <ProfilePanel\b.*?/>\}', s, re.S)
          if not m:
              raise SystemExit("Could not locate profile panel render")

          old = m.group(0)
          props = old[len('{active === "profile" && <ProfilePanel '):-3]
          own_props = props
          if 'key="own-profile"' not in own_props:
              own_props = 'key="own-profile" ' + own_props
          own_props = own_props.replace('userId={session.user.id}', 'userId={session.user.id} viewerId={session.user.id}', 1)

          viewed_props = props
          viewed_props = viewed_props.replace('userId={session.user.id}', 'key={`viewed-${viewedProfile.id}`} userId={viewedProfile.id} viewerId={session.user.id}', 1)
          viewed_props = viewed_props.replace('profile={profile}', 'profile={viewedProfile}', 1)
          viewed_props = viewed_props.replace('stats={stats}', 'stats={undefined}', 1)

          replacement = '{active === "profile" && <ProfilePanel ' + own_props + '/>}\n'
          replacement += '{active === "view-profile" && viewedProfile && <ProfilePanel ' + viewed_props + '/>}'
          s = s[:m.start()] + replacement + s[m.end():]
          p.write_text(s, encoding="utf-8")

      - name: Commit repaired source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.jsx
          git diff --cached --quiet && exit 0
          git commit -m "Fix main.jsx build and viewed profiles"
          git push

      - name: Remove temporary repair workflow
        if: success()
        run: |
          git rm .github/workflows/repair-main-build.yml
          git commit -m "Remove temporary build repair workflow"
          git push
