name: Fix Convogram back navigation

on:
  push:
    paths:
      - .github/workflows/fix-back-navigation.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch navigation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/main.jsx")
          text = path.read_text()

          text = text.replace(
              'import { useEffect, useState } from "react";',
              'import { useEffect, useRef, useState } from "react";'
          )

          old = '  const [active, setActive] = useState("home");'
          new = '''  const [active, setActiveState] = useState("home");
          const activeRef = useRef("home");
          const navigationStackRef = useRef([]);

          // All page changes go through this wrapper so Android/browser Back
          // can return to the immediately previous Convogram screen.
          function setActive(nextPage) {
            if (!nextPage || nextPage === activeRef.current) return;
            navigationStackRef.current.push(activeRef.current);
            activeRef.current = nextPage;
            setActiveState(nextPage);
            window.history.pushState({ convogram: true }, "", window.location.href);
          }

          function goBack() {
            const previousPage = navigationStackRef.current.pop();
            if (!previousPage) {
              // Keep the app inside the SPA instead of allowing Back to exit it.
              window.history.pushState({ convogram: true }, "", window.location.href);
              return;
            }
            activeRef.current = previousPage;
            setActiveState(previousPage);
            window.history.back();
          }

          useEffect(() => {
            // Create an in-app history boundary. This prevents Android/browser
            // Back from immediately closing the Convogram SPA at Home.
            window.history.replaceState({ convogram: true }, "", window.location.href);
            window.history.pushState({ convogram: true, root: true }, "", window.location.href);

            const handlePopState = () => {
              const previousPage = navigationStackRef.current.pop();
              if (previousPage) {
                activeRef.current = previousPage;
                setActiveState(previousPage);
              } else {
                // Re-arm the root boundary so Back never exits the SPA.
                window.history.pushState({ convogram: true, root: true }, "", window.location.href);
              }
            };

            window.addEventListener("popstate", handlePopState);
            return () => window.removeEventListener("popstate", handlePopState);
          }, []);'''
          if old not in text:
              raise SystemExit("active state marker not found")
          text = text.replace(old, new, 1)

          text = text.replace(
              '  const backToProfile = () => setActive("profile");\n\n',
              ''
          )
          text = text.replace(
              'onBack={() => setActive("home")}',
              'onBack={goBack}'
          )
          text = text.replace(
              'onBack={backToProfile}',
              'onBack={goBack}'
          )

          path.write_text(text)
          PY

      - name: Verify patch
        run: |
          grep -q 'useEffect, useRef, useState' src/main.jsx
          grep -q 'function goBack()' src/main.jsx
          grep -q 'window.addEventListener("popstate", handlePopState)' src/main.jsx
          grep -q 'onBack={goBack}' src/main.jsx

      - name: Commit and remove patch workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.jsx .github/workflows/fix-back-navigation.yml
          git commit -m "fix: make back navigation return to previous page" || exit 0
          git rm .github/workflows/fix-back-navigation.yml
          git commit -m "chore: remove temporary navigation patch workflow"
          git push
