name: Build Signed Convogram Release APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Install SVG converter
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - name: Generate Convogram launcher icon
        run: node scripts/generate-android-icon.mjs

      - name: Add Android permissions
        run: node scripts/add-android-permissions.mjs

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build unsigned release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Create temporary release signing key
        env:
          STORE_PASSWORD: ${{ secrets.CONVOGRAM_RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.CONVOGRAM_RELEASE_KEY_PASSWORD }}
        run: |
          STORE_PASSWORD="${STORE_PASSWORD:-convogram-release-2026}"
          KEY_PASSWORD="${KEY_PASSWORD:-convogram-release-2026}"
          echo "STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          keytool -genkeypair -v -keystore convogram-release.jks -alias convogram -keyalg RSA -keysize 2048 -validity 10000 -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" -dname "CN=Convogram, OU=Khaliph Industries, O=Khaliph Industries, L=Nairobi, ST=Nairobi, C=KE"

      - name: Sign release APK
        run: |
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$ZIPALIGN" -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk Convogram-aligned.apk
          "$APKSIGNER" sign --ks convogram-release.jks --ks-key-alias convogram --ks-pass env:STORE_PASSWORD --key-pass env:KEY_PASSWORD --out Convogram.apk Convogram-aligned.apk
          "$APKSIGNER" verify --verbose Convogram.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: convogram-${{ github.run_number }}-release
          name: Convogram Android ${​{ github.run_number }} Release
          body: |
            ## Convogram Android — Release APK

            This is the installable Convogram release APK, not a debug APK.

            It includes the current main branch, Android permissions, and the Convogram launcher icon.
          files: Convogram.apk
          generate_release_notes: true
          make_latest: true
