name: Build Convogram Android Release

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Build web app
        run: npm run build
      - name: Create Android project
        run: npx cap add android
      - name: Install SVG icon converter
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin
      - name: Generate Convogram launcher icon
        run: node scripts/generate-android-icon.mjs
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Restore permanent release keystore
        env:
          CONVOGRAM_KEYSTORE_BASE64: ${{ secrets.CONVOGRAM_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$CONVOGRAM_KEYSTORE_BASE64" ]; then
            echo "Missing CONVOGRAM_KEYSTORE_BASE64. Refusing to create an insecure temporary signing key."
            exit 1
          fi
          echo "$CONVOGRAM_KEYSTORE_BASE64" | base64 --decode > android/convogram-release.jks
          test -s android/convogram-release.jks
      - name: Configure release signing
        working-directory: android
        env:
          CONVOGRAM_KEYSTORE_PASSWORD: ${{ secrets.CONVOGRAM_KEYSTORE_PASSWORD }}
          CONVOGRAM_KEY_ALIAS: ${{ secrets.CONVOGRAM_KEY_ALIAS }}
          CONVOGRAM_KEY_PASSWORD: ${{ secrets.CONVOGRAM_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/build.gradle')
          if not p.exists():
              raise SystemExit('Generated Android project is missing app/build.gradle')
          s = p.read_text()
          if 'signingConfigs' not in s:
              s += '''

android {
    signingConfigs {
        release {
            storeFile file('convogram-release.jks')
            storePassword System.getenv('CONVOGRAM_KEYSTORE_PASSWORD')
            keyAlias System.getenv('CONVOGRAM_KEY_ALIAS')
            keyPassword System.getenv('CONVOGRAM_KEY_PASSWORD')
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }
}
'''
              p.write_text(s)
          PY
      - name: Build signed release APK
        working-directory: android
        env:
          CONVOGRAM_KEYSTORE_PASSWORD: ${{ secrets.CONVOGRAM_KEYSTORE_PASSWORD }}
          CONVOGRAM_KEY_ALIAS: ${{ secrets.CONVOGRAM_KEY_ALIAS }}
          CONVOGRAM_KEY_PASSWORD: ${{ secrets.CONVOGRAM_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon
      - name: Verify release APK signature
        run: |
          test -s android/app/build/outputs/apk/release/app-release.apk
          BUILD_TOOLS=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --verbose android/app/build/outputs/apk/release/app-release.apk
      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: Convogram-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
