name: WhatsApp-style emoji picker
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/whatsapp-emoji-fix.yml
permissions:
  contents: write
jobs:
  patch:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'WhatsApp-style full emoji picker')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install full emoji picker
        run: npm install emoji-picker-react --save --no-audit --no-fund
      - name: Patch composer
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/components/MessagesPanelOriginal.jsx')
          s=p.read_text()
          if 'from "emoji-picker-react"' not in s:
              s=s.replace('import { VerifiedBadge } from "./VerifiedBadge";', 'import { VerifiedBadge } from "./VerifiedBadge";\nimport EmojiPicker from "emoji-picker-react";')
          # Use the existing picker state when present; otherwise add it without changing any other chat state.
          if 'const [emojiOpen' not in s:
              anchor='const [replyingTo, setReplyingTo] = useState(null), [menuMessage, setMenuMessage] = useState(null), [editingMessage, setEditingMessage] = useState(null), [reactionOpen, setReactionOpen] = useState(false), [swipe, setSwipe] = useState({ id: null, x: 0 });'
              if anchor in s:
                  s=s.replace(anchor, anchor[:-2] + ', [emojiOpen, setEmojiOpen] = useState(false);', 1)
          # Replace the existing emoji panel safely, including nested divs.
          marker='<div className="convogram-emoji-panel"'
          start=s.find(marker)
          if start < 0:
              raise SystemExit('emoji panel marker missing')
          depth=0; i=start
          while True:
              a=s.find('<div', i); b=s.find('</div>', i)
              if b < 0: raise SystemExit('emoji panel end missing')
              if a >= 0 and a < b:
                  depth += 1; i=a+4
              else:
                  depth -= 1; i=b+6
                  if depth == 0:
                      end=i; break
          panel='<div className="convogram-emoji-panel"><EmojiPicker onEmojiClick={(emojiData) => { setDraft(d => d + emojiData.emoji); requestAnimationFrame(() => composerRef.current?.focus()); }} width="100%" height="100%" previewConfig={{ showPreview: false }} skinTonesDisabled={false} searchDisabled={false} lazyLoadEmojis={true} /></div>'
          s=s[:start]+panel+s[end:]
          # Ensure the picker button remains only an emoji toggle immediately before the media button.
          if 'aria-label="Open emoji picker"' not in s:
              needle='<button type="button" className="convogram-stable-icon" aria-label="Add media"'
              if needle not in s: raise SystemExit('media button marker missing')
              s=s.replace(needle, '<button type="button" className="convogram-stable-icon" aria-label="Open emoji picker" onClick={() => setEmojiOpen(v => !v)}><Smile size={20}/></button>'+needle, 1)
          p.write_text(s)
          PY
      - name: Style only the emoji panel
        run: |
          cat >> src/components/MessagesPanel.css <<'EOF'

          /* Full WhatsApp-style emoji picker; no other chat controls changed. */
          .convogram-stable-composer-wrap{position:relative}
          .convogram-emoji-panel{position:absolute;left:0;right:0;bottom:calc(100% + 4px);height:min(360px,52vh);z-index:80;background:#111;border:1px solid #292929;border-radius:14px 14px 0 0;overflow:hidden;box-shadow:0 -8px 28px rgba(0,0,0,.45)}
          .convogram-emoji-panel .EmojiPickerReact{width:100%!important;height:100%!important}
          EOF
      - name: Build validation
        run: npm run build
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/MessagesPanelOriginal.jsx src/components/MessagesPanel.css package.json package-lock.json
          git commit -m 'WhatsApp-style full emoji picker'
          git push
      - name: Remove one-time workflow
        if: success()
        run: |
          git rm .github/workflows/whatsapp-emoji-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove emoji picker patch workflow'
          git push
