name: WhatsApp-style emoji picker
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/whatsapp-emoji-fix.yml
permissions:
  contents: write
jobs:
  patch:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'WhatsApp-style full emoji picker')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install full emoji picker
        run: npm install emoji-picker-react --save --no-audit --no-fund
      - name: Replace emoji panel only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/components/MessagesPanelOriginal.jsx')
          s=p.read_text()
          if 'from "emoji-picker-react"' not in s:
              s=s.replace('import { VerifiedBadge } from "./VerifiedBadge";', 'import { VerifiedBadge } from "./VerifiedBadge";\nimport EmojiPicker from "emoji-picker-react";', 1)
          marker='<div className="convogram-emoji-panel"'
          start=s.find(marker)
          if start < 0: raise SystemExit('emoji panel marker missing')
          depth=0; i=start
          while True:
              a=s.find('<div', i); b=s.find('</div>', i)
              if b < 0: raise SystemExit('emoji panel end missing')
              if a >= 0 and a < b:
                  depth += 1; i=a+4
              else:
                  depth -= 1; i=b+6
                  if depth == 0: end=i; break
          panel='<div className="convogram-emoji-panel" role="dialog" aria-label="Emoji picker"><EmojiPicker onEmojiClick={(emojiData) => { setDraft(d => d + emojiData.emoji); requestAnimationFrame(() => composerRef.current?.focus()); }} width="100%" height="100%" previewConfig={{ showPreview: false }} skinTonesDisabled={false} searchDisabled={false} lazyLoadEmojis={true} /></div>'
          s=s[:start]+panel+s[end:]
          p.write_text(s)
          PY
      - name: Style only the emoji panel
        run: |
          cat >> src/components/MessagesPanel.css <<'EOF'

          /* Full WhatsApp-style emoji picker; no other chat controls changed. */
          .convogram-emoji-panel{position:relative;left:auto;right:auto;bottom:auto;height:min(360px,52vh);z-index:80;background:#111;border:1px solid #292929;border-radius:14px;overflow:hidden;box-shadow:0 -8px 28px rgba(0,0,0,.45)}
          .convogram-emoji-panel .EmojiPickerReact{width:100%!important;height:100%!important}
          EOF
      - name: Build validation
        run: npm run build
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/MessagesPanelOriginal.jsx src/components/MessagesPanel.css package.json package-lock.json
          git commit -m 'WhatsApp-style full emoji picker'
          git push
      - name: Remove one-time workflow
        if: success()
        run: |
          git rm .github/workflows/whatsapp-emoji-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove emoji picker patch workflow'
          git push
