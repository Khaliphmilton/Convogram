name: Build and Release Convogram Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Apply emoji keyboard replacement fix only
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          jsx = Path('src/components/MessagesPanelOriginal.jsx')
          s = jsx.read_text()
          anchor = 'const [replyingTo, setReplyingTo] = useState(null), [menuMessage, setMenuMessage] = useState(null), [editingMessage, setEditingMessage] = useState(null), [reactionOpen, setReactionOpen] = useState(false), [swipe, setSwipe] = useState({ id: null, x: 0 });'
          if 'const [emojiOpen, setEmojiOpen]' not in s:
              if anchor not in s: raise SystemExit('chat state anchor not found')
              s = s.replace(anchor, anchor + '\n  const [emojiOpen, setEmojiOpen] = useState(false);', 1)
          marker = '  const scrollToPinned = () => {'
          if 'const toggleEmojiPicker' not in s:
              if marker not in s: raise SystemExit('scrollToPinned marker not found')
              helper = '  const toggleEmojiPicker = () => { setEmojiOpen(open => { const next = !open; requestAnimationFrame(() => { if (next) document.activeElement?.blur(); else composerRef.current?.focus(); }); return next; }); };\n'
              s = s.replace(marker, helper + marker, 1)
          start = s.find('<EmojiPicker')
          if start < 0: raise SystemExit('EmojiPicker component not found')
          end = s.find('/>', start)
          if end < 0: raise SystemExit('EmojiPicker closing marker not found')
          component = '''<EmojiPicker
          onEmojiClick={(emojiData) => { setDraft(value => value + emojiData.emoji); requestAnimationFrame(() => composerRef.current?.focus()); }}
          width="100%"
          height="100%"
          theme="dark"
          previewConfig={{ showPreview: false }}
          searchDisabled={false}
          skinTonesDisabled={false}
          lazyLoadEmojis={true}
        />'''
          replacement = '{emojiOpen && <div className="convogram-emoji-keyboard-replacement" role="dialog" aria-label="Emoji picker">' + component + '</div>}'
          s = s[:start] + replacement + s[end+2:]
          if 'aria-label="Open emoji picker"' not in s:
              image_pos = s.find('<ImagePlus')
              if image_pos < 0: raise SystemExit('ImagePlus marker not found')
              button_start = s.rfind('<button', 0, image_pos)
              if button_start < 0: raise SystemExit('media button start not found')
              button = '<button type="button" className="convogram-stable-icon" aria-label="Open emoji picker" aria-pressed={emojiOpen} onClick={toggleEmojiPicker}><Smile size={20}/></button>'
              s = s[:button_start] + button + s[button_start:]
          jsx.write_text(s)
          css = Path('src/components/MessagesPanel.css')
          c = css.read_text()
          c += '''\n/* Convogram emoji picker replaces the Android keyboard region while open. */
.convogram-stable-chat .convogram-emoji-keyboard-replacement{position:fixed;left:0;right:0;bottom:calc(68px + env(safe-area-inset-bottom,0px));height:min(43vh,380px);min-height:270px;z-index:80;background:#0b0b0b;border-top:1px solid #202020;overflow:hidden;box-shadow:0 -8px 28px rgba(0,0,0,.38)}
.convogram-stable-chat .convogram-emoji-keyboard-replacement .EmojiPickerReact{width:100%!important;height:100%!important;background:#0b0b0b!important;border:0!important;border-radius:0!important;--epr-bg-color:#0b0b0b;--epr-category-label-bg-color:#0b0b0b;--epr-picker-border-color:#202020;--epr-search-input-bg-color:#111;--epr-search-input-border-color:#252525;--epr-search-input-text-color:#fff;--epr-text-color:#fff;--epr-category-icon-active-color:#20a4f3;--epr-hover-bg-color:#151515;--epr-focus-bg-color:#151515}
.convogram-stable-chat .convogram-emoji-keyboard-replacement .epr-search-container{background:#0b0b0b!important;padding:10px!important}.convogram-stable-chat .convogram-emoji-keyboard-replacement .epr-search-container input{background:#111!important;border:1px solid #252525!important;color:#fff!important;border-radius:20px!important}.convogram-stable-chat .convogram-emoji-keyboard-replacement .epr-category-nav{background:#0b0b0b!important;border-top:1px solid #202020!important}.convogram-stable-chat .convogram-emoji-keyboard-replacement .epr-category-nav button{color:#aaa!important;background:transparent!important}.convogram-stable-chat .convogram-emoji-keyboard-replacement .epr-category-nav button.epr-active{color:#20a4f3!important;background:#151515!important}
@media(max-width:760px){.convogram-stable-chat .convogram-emoji-keyboard-replacement{bottom:calc(68px + env(safe-area-inset-bottom,0px));height:min(44vh,380px);min-height:260px}}
'''
          css.write_text(c)
          PY
      - name: Verify emoji keyboard replacement patch
        run: |
          set -e
          grep -q 'const [emojiOpen, setEmojiOpen]' src/components/MessagesPanelOriginal.jsx
          grep -q 'convogram-emoji-keyboard-replacement' src/components/MessagesPanelOriginal.jsx
          grep -q 'aria-label="Open emoji picker"' src/components/MessagesPanelOriginal.jsx
      - name: Harden login and account startup
        run: node scripts/harden-login.mjs
      - name: Verify login hardening was applied
        run: |
          set -e
          grep -q 'setTimeout(() => {' src/main.jsx
          grep -q 'Could not start Convogram' src/main.jsx
          grep -q 'Unable to sign in right now' src/main.jsx
          grep -q 'class ConvogramErrorBoundary' src/main.jsx
          ! grep -q 'Loading your social world' src/main.jsx
      - name: Write build version manifest
        env:
          ANDROID_VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          mkdir -p public
          printf '{"version":"%s","releasedAt":"%s"}\n' "$ANDROID_VERSION_NAME" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > public/app-version.json
      - name: Build web app
        run: npm run build
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Create Android app shell
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap add android
          npx cap sync android
      - name: Configure Firebase Android push
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: node scripts/configure-firebase-android.mjs
      - name: Add Android permissions
        run: node scripts/add-android-permissions.mjs
      - name: Install SVG build tool
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin
      - name: Generate Convogram Android branding
        run: node scripts/generate-android-icon.mjs
      - name: Finalize Convogram Android branding and launch theme
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: 1.0.${{ github.run_number }}
        run: node scripts/finalize-android-branding.mjs
      - name: Verify Convogram Android branding and launch theme
        run: |
          set -e
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do test -f android/app/src/main/res/mipmap-$d/ic_launcher.png; done
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do test -f android/app/src/main/res/mipmap-$d/ic_launcher_round.png; done
          test -f android/app/src/main/res/drawable/convogram_launch_background.xml
          test -f android/app/src/main/res/values-v31/convogram_launch.xml
          test ! -e android/app/src/main/res/drawable-nodpi/convogram_splash.png
          test ! -e android/app/src/main/res/mipmap-anydpi/ic_launcher.xml
          test ! -e android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          if grep -Rqi 'capacitor_splash\|splash_screen' android/app/src/main; then echo 'Default Capacitor splash resource remains'; exit 1; fi
          if grep -Rqi 'com.getcapacitor' android/app/src/main/res; then echo 'Capacitor branding remains in Android resources'; exit 1; fi
          grep -Rqi 'ConvogramLaunchTheme' android/app/src/main/AndroidManifest.xml
          grep -q 'versionCode ${{ github.run_number }}' android/app/build.gradle
          grep -q 'versionName "1.0.${{ github.run_number }}"' android/app/build.gradle

      - name: Prepare Android signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -e
          test -n "$KEYSTORE_B64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/convogram-release.jks"
          chmod 600 "$GITHUB_WORKSPACE/convogram-release.jks"
          keytool -list -keystore "$GITHUB_WORKSPACE/convogram-release.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

      - name: Build signed release APK
        working-directory: android
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -e
          ./gradlew assembleRelease -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/convogram-release.jks" -Pandroid.injected.signing.store.password="$STORE_PASSWORD" -Pandroid.injected.signing.key.alias="$KEY_ALIAS" -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          test -f app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Upload signed release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: convogram-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub release and attach signed APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: convogram-build-${{ github.run_number }}
          name: Convogram Android Build ${{ github.run_number }}
          generate_release_notes: false
          files: android/app/build/outputs/apk/release/app-release.apk

      - name: Remove signing key
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/convogram-release.jks"
