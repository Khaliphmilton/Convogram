name: Build and Release Convogram Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Harden login and account startup
        run: node scripts/harden-login.mjs
      - name: Build web app
        run: npm run build
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Create Android app shell
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap add android
          npx cap sync android
      - name: Add Android permissions
        run: node scripts/add-android-permissions.mjs
      - name: Install SVG build tool
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin
      - name: Generate Convogram Android branding
        run: node scripts/generate-android-icon.mjs
      - name: Remove default Capacitor branding
        run: |
          set -e
          rm -f android/app/src/main/res/mipmap-anydpi/ic_launcher.xml
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          rm -f android/app/src/main/res/mipmap-anydpi/ic_launcher_round.xml
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          rm -f android/app/src/main/res/mipmap-anydpi/ic_launcher_foreground.xml
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_foreground.xml
          find android/app/src/main/res -type f -iname '*capacitor*' -delete
          grep -RIl '@capacitor/splash-screen' android/app/src/main/res 2>/dev/null | xargs -r rm -f
          find android/app/src/main/res -type f -name '*.xml' -print0 | xargs -0 -r sed -i \
            -e '/windowSplashScreenAnimatedIcon/d' \
            -e '/android:windowSplashScreenIconBackgroundColor/d' \
            -e '/postSplashScreenTheme/d'
      - name: Finalize Convogram Android branding
        run: node scripts/finalize-android-branding.mjs
      - name: Verify Convogram Android branding
        run: |
          set -e
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do test -f android/app/src/main/res/mipmap-$d/ic_launcher.png; done
          test -f android/app/src/main/res/drawable/splash.png
          test ! -e android/app/src/main/res/mipmap-anydpi/ic_launcher.xml
          test ! -e android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          if grep -Rqs '@capacitor/splash-screen' android/app/src/main/res; then echo 'Default Capacitor splash resources remain'; exit 1; fi
          if grep -Rqs 'capacitor' android/app/src/main/res; then echo 'Capacitor branding remains'; exit 1; fi
      - name: Prepare Android signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -e
          test -n "$KEYSTORE_B64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/convogram-release.jks"
          chmod 600 "$GITHUB_WORKSPACE/convogram-release.jks"
          keytool -list -keystore "$GITHUB_WORKSPACE/convogram-release.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
      - name: Build signed release APK
        working-directory: android
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -e
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/convogram-release.jks" \
            -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          test -f app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
      - name: Upload signed release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: convogram-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Create GitHub release and attach signed APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: convogram-build-${{ github.run_number }}
          name: Convogram Android Build ${{ github.run_number }}
          generate_release_notes: false
          files: android/app/build/outputs/apk/release/app-release.apk
      - name: Remove signing key
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/convogram-release.jks"
