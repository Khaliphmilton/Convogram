name: Build and Release Convogram Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify Java
        run: java -version

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor Android and create native project
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap add android
          npx cap sync android

      - name: Add Android permissions
        run: node scripts/add-android-permissions.mjs

      - name: Install SVG build tool
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - name: Generate Convogram Android branding
        run: node scripts/generate-android-icon.mjs

      # Uses the repository secrets already configured for Convogram.
      - name: Prepare Android signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -e
          test -n "$KEYSTORE_B64" || { echo "ANDROID_KEYSTORE_BASE64 secret is missing"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "ANDROID_KEYSTORE_PASSWORD secret is missing"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "ANDROID_KEY_ALIAS secret is missing"; exit 1; }
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/convogram-release.jks"
          chmod 600 "$GITHUB_WORKSPACE/convogram-release.jks"
          keytool -list -keystore "$GITHUB_WORKSPACE/convogram-release.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

      - name: Build signed release APK
        working-directory: android
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -e
          test -n "$STORE_PASSWORD" || { echo "ANDROID_KEYSTORE_PASSWORD secret is missing"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "ANDROID_KEY_PASSWORD secret is missing"; exit 1; }
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/convogram-release.jks" \
            -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          test -f app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Upload signed release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: convogram-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub release and attach signed APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: convogram-build-${{ github.run_number }}
          name: Convogram Android Build ${{ github.run_number }}
          generate_release_notes: false
          files: android/app/build/outputs/apk/release/app-release.apk

      - name: Remove signing key
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/convogram-release.jks"
