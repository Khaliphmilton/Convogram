name: Build and Release Convogram Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Add Android camera microphone and storage permissions
        run: node scripts/add-android-permissions.mjs

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Configure permanent release signing
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "ANDROID_KEYSTORE_BASE64 is empty"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "ANDROID_KEYSTORE_PASSWORD is empty"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "ANDROID_KEY_ALIAS is empty"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "ANDROID_KEY_PASSWORD is empty"; exit 1; }

          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > convogram-source.keystore
          test -s convogram-source.keystore || { echo "Decoded keystore is empty"; exit 1; }

          echo "Validating the permanent Convogram signing key..."
          STORE_INFO="$(keytool -list -keystore convogram-source.keystore -storepass "$ANDROID_KEYSTORE_PASSWORD")"
          echo "$STORE_INFO" | grep -E 'Keystore type:|Provider:|Your keystore contains' || true

          STORE_TYPE="$(printf '%s\n' "$STORE_INFO" | awk -F': ' '/Keystore type:/ {print $2; exit}')"
          case "$STORE_TYPE" in
            PKCS12|JKS) ;;
            *) echo "Unsupported or undetected keystore type: $STORE_TYPE"; exit 1 ;;
          esac

          echo "Checking permanent key alias..."
          keytool -list -keystore convogram-source.keystore -storetype "$STORE_TYPE" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS"

          if [ "$STORE_TYPE" = "PKCS12" ]; then
            echo "Converting the same permanent key container to JKS for Gradle..."
            keytool -importkeystore -noprompt \
              -srckeystore convogram-source.keystore \
              -srcstoretype PKCS12 \
              -srcstorepass "$ANDROID_KEYSTORE_PASSWORD" \
              -srcalias "$ANDROID_KEY_ALIAS" \
              -srckeypass "$ANDROID_KEY_PASSWORD" \
              -destkeystore convogram-release.jks \
              -deststoretype JKS \
              -deststorepass "$ANDROID_KEYSTORE_PASSWORD" \
              -destalias "$ANDROID_KEY_ALIAS" \
              -destkeypass "$ANDROID_KEY_PASSWORD"
          else
            cp convogram-source.keystore convogram-release.jks
          fi

          keytool -list -keystore convogram-release.jks -storetype JKS \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          echo "Permanent signing key validated successfully."

          cat >> app/build.gradle <<'EOF'

          android {
              signingConfigs {
                  release {
                      storeFile file("../convogram-release.jks")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                      storeType "JKS"
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF

      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Convogram.apk

      - name: Verify APK signature
        run: |
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose Convogram.apk

      - name: Create permanent GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: convogram-${{ github.run_number }}
          name: Convogram Android ${{ github.run_number }}
          body: |
            ## Convogram Android

            This is the signed release APK. It is signed with Convogram's permanent release key so future updates can install over this version.

            **APK:** Convogram.apk
          files: Convogram.apk
          generate_release_notes: true
          make_latest: true

# Trigger release build after signing-key refresh.
