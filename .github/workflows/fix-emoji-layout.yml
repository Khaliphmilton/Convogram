name: Fix emoji picker layout
on:
  push:
    branches: [main]
jobs:
  patch:
    if: !contains(github.event.head_commit.message, 'Apply emoji picker layout')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch emoji picker layout only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/MessagesPanelOriginal.jsx')
          s = p.read_text()
          # Ensure emoji-open state exists without touching existing chat state.
          if 'const [emojiOpen, setEmojiOpen]' not in s:
              anchor = 'const [replyingTo, setReplyingTo] = useState(null), [menuMessage, setMenuMessage] = useState(null), [editingMessage, setEditingMessage] = useState(null), [reactionOpen, setReactionOpen] = useState(false), [swipe, setSwipe] = useState({ id: null, x: 0 });'
              if anchor not in s:
                  raise SystemExit('state anchor missing')
              s = s.replace(anchor, anchor + '\n  const [emojiOpen, setEmojiOpen] = useState(false);', 1)
          # Make the emoji button close the Android keyboard before opening the picker.
          old = 'onClick={() => setEmojiOpen(v => !v)}'
          new = 'onClick={() => { const active = document.activeElement; if (active && typeof active.blur === "function") active.blur(); setEmojiOpen(v => !v); }}'
          if old in s:
              s = s.replace(old, new, 1)
          # If the picker button is absent, add it only before the existing media control.
          if 'aria-label="Open emoji picker"' not in s:
              needle = '<button type="button" className="convogram-stable-icon" aria-label="Add media"'
              if needle in s:
                  s = s.replace(needle, '<button type="button" className="convogram-stable-icon" aria-label="Open emoji picker" onClick={() => { const active = document.activeElement; if (active && typeof active.blur === "function") active.blur(); setEmojiOpen(v => !v); }}><Smile size={20}/></button>' + needle, 1)
          p.write_text(s)
          cssp = Path('src/components/MessagesPanel.css')
          css = cssp.read_text()
          css += '''\n/* Emoji picker replaces the Android keyboard area and uses Convogram's existing UI. */
.messages-panel.chat-open>.chat-window .convogram-emoji-panel{position:absolute;left:0;right:0;bottom:calc(60px + env(safe-area-inset-bottom));height:min(44vh,420px);z-index:40;background:#0b0b0b;border:1px solid #202020;border-radius:14px 14px 0 0;overflow:hidden;box-shadow:0 -10px 30px rgba(0,0,0,.35);color:#f5f5f5}
.messages-panel.chat-open>.chat-window .convogram-emoji-panel .EmojiPickerReact{width:100%!important;height:100%!important;--epr-bg-color:#0b0b0b;--epr-category-label-bg-color:#0b0b0b;--epr-picker-border-color:#202020;--epr-search-input-bg-color:#151515;--epr-search-input-text-color:#f5f5f5;--epr-search-input-placeholder-color:#777;--epr-hover-bg-color:#181818;--epr-focus-bg-color:#181818;--epr-category-icon-active-color:#ffffff;--epr-text-color:#f5f5f5;--epr-highlight-color:#e9e9e9}
@media(max-width:760px){.messages-panel.chat-open>.chat-window .convogram-emoji-panel{bottom:calc(60px + env(safe-area-inset-bottom));height:min(48vh,420px);border-radius:12px 12px 0 0}.messages-panel.chat-open>.chat-window .message-composer{z-index:50}}
'''
          cssp.write_text(css)
          PY
      - name: Validate build
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/MessagesPanelOriginal.jsx src/components/MessagesPanel.css
          git commit -m 'Apply emoji picker layout' || exit 0
          git push
      - name: Remove one-time workflow
        if: success()
        run: |
          git rm .github/workflows/fix-emoji-layout.yml
          git commit -m 'Remove emoji layout workflow'
          git push
