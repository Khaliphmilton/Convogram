name: Repair chat build

on:
  push:
    branches: [main]

jobs:
  repair:
    if: github.sha == '415552a008cc81555a7bb8dce7947baf631427bd'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore last known-good chat renderer
        run: |
          git checkout 7f5e31b02d2deb6c2fa5a815c6b3a348ce26b463 -- src/components/MessagesPanelOriginal.jsx
      - name: Remove temporary repair workflows
        run: |
          rm -f .github/workflows/fix-chat-syntax.yml .github/workflows/repair-chat-build.yml
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/MessagesPanelOriginal.jsx .github/workflows/fix-chat-syntax.yml .github/workflows/repair-chat-build.yml
          git diff --cached --quiet || git commit -m 'Fix chat renderer build syntax'
          git push