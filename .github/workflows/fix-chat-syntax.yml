name: Fix chat JSX syntax
on:
  push:
    branches: [main]
    paths:
      - 'src/components/MessagesPanelOriginal.jsx'
      - '.github/workflows/fix-chat-syntax.yml'
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix generated JSX typo
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/MessagesPanelOriginal.jsx')
          s = p.read_text()
          s2 = s.replace('${mine?\"mine\":\"\"\"\"\"}', '${mine?\"mine\":\"\"}')
          if s2 == s:
              raise SystemExit('No syntax typo found')
          p.write_text(s2)
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/MessagesPanelOriginal.jsx
          git commit -m 'Fix chat JSX syntax'
          git push
