name: Fix feed profile navigation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'Fix feed profile navigation wiring'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch feed profile navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/components/PostCard.jsx')
          s = p.read_text()
          old = "const openAuthorProfile=()=>{if(!author?.id)return;try{sessionStorage.setItem('convogram:pending-profile',JSON.stringify(author));}catch{}const profileButton=[...document.querySelectorAll('.sidebar button')].find(button=>button.textContent?.trim().startsWith('Profile'));profileButton?.click();};"
          new = "const openAuthorProfile=()=>{if(!author?.id)return;if(onOpenProfile){onOpenProfile(author);return;}try{sessionStorage.setItem('convogram:pending-profile',JSON.stringify(author));}catch{}const profileButton=[...document.querySelectorAll('.sidebar button')].find(button=>button.textContent?.trim().startsWith('Profile'));profileButton?.click();};"
          if old not in s:
              raise SystemExit('PostCard navigation code not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('src/main.jsx')
          s = p.read_text()
          old = '''const openAccount = (account) => {\n    if (!account?.id) return;\n    setViewedProfile({ ...account });\n    setProfileTab("posts");\n    setActive("view-profile");\n  };'''
          new = '''const openAccount = (account) => {\n    if (!account?.id) return;\n    setViewedProfile({ ...account });\n    setProfileTab("posts");\n    setActive("profile");\n  };'''
          if old not in s:
              raise SystemExit('openAccount code not found')
          s = s.replace(old, new, 1)

          old = 'onDelete={()=>removePost(p)} likeCount={p.likes?.[0]?.count||0} commentCount={p.comments?.[0]?.count||0}/>'
          new = 'onDelete={()=>removePost(p)} onOpenProfile={openAccount} likeCount={p.likes?.[0]?.count||0} commentCount={p.comments?.[0]?.count||0}/>'
          if old not in s:
              raise SystemExit('Feed PostCard render not found')
          s = s.replace(old, new, 1)

          old = '<ProfilePanel key="own-profile" userId={session.user.id} viewerId={session.user.id} profile={profile} stats={stats} initialTab={profileTab}'
          new = '<ProfilePanel key={`profile-${viewedProfile?.id || session.user.id}`} userId={viewedProfile?.id || session.user.id} viewerId={session.user.id} profile={viewedProfile || profile} stats={viewedProfile ? undefined : stats} initialTab={profileTab}'
          if old not in s:
              raise SystemExit('ProfilePanel render not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.jsx src/components/PostCard.jsx
          git commit -m 'Fix feed profile target account'
          git push

      - name: Remove temporary workflow
        run: |
          rm .github/workflows/fix-feed-profile.yml
          git add .github/workflows/fix-feed-profile.yml
          git commit -m 'Remove temporary feed profile repair workflow'
          git push
