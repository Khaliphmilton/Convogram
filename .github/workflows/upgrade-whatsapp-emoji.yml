name: Upgrade WhatsApp emoji panel
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/upgrade-whatsapp-emoji.yml
jobs:
  patch:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'Upgrade WhatsApp emoji panel')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch full WhatsApp-style emoji picker only
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path

          # Add the full emoji picker library without changing existing app behavior.
          pkg = Path('package.json')
          data = json.loads(pkg.read_text())
          deps = data.setdefault('dependencies', {})
          deps.setdefault('emoji-picker-react', '^4.15.1')
          pkg.write_text(json.dumps(data, indent=2) + '\n')

          p = Path('src/components/MessagesPanelOriginal.jsx')
          s = p.read_text()

          if 'from "emoji-picker-react"' not in s:
              marker = 'import { VerifiedBadge } from "./VerifiedBadge";'
              if marker not in s:
                  raise SystemExit('VerifiedBadge import marker not found')
              s = s.replace(marker, marker + '\nimport EmojiPicker from "emoji-picker-react";', 1)

          # Replace only the existing emoji-picker JSX, using balanced div parsing so
          # nested elements in the current implementation are handled safely.
          marker = '<div className="convogram-emoji-panel"'
          start = s.find(marker)
          if start < 0:
              raise SystemExit('convogram-emoji-panel marker not found')

          pos = start
          depth = 0
          token_re = re.compile(r'<div\\b[^>]*>|</div\\s*>')
          end = None
          for m in token_re.finditer(s, start):
              token = m.group(0)
              if token.startswith('<div'):
                  depth += 1
              else:
                  depth -= 1
                  if depth == 0:
                      end = m.end()
                      break
          if end is None:
              raise SystemExit('could not find end of emoji panel')

          panel = '''<div className="convogram-emoji-panel" role="dialog" aria-label="Emoji picker">
        <EmojiPicker
          onEmojiClick={(emojiData) => {
            setDraft((value) => value + emojiData.emoji);
            requestAnimationFrame(() => composerRef.current?.focus());
          }}
          width="100%"
          height="100%"
          previewConfig={{ showPreview: false }}
          searchDisabled={false}
          skinTonesDisabled={false}
          lazyLoadEmojis={true}
        />
      </div>'''
          s = s[:start] + panel + s[end:]

          # Override only the emoji picker container; all existing chat styles remain intact.
          css_path = Path('src/components/MessagesPanel.css')
          css = css_path.read_text() if css_path.exists() else ''
          css += '''\n/* Convogram emoji picker: WhatsApp-style full categories/search/skin tones. */
.convogram-emoji-panel{position:absolute;left:0;right:0;bottom:calc(100% + 4px);height:min(360px,52vh);background:#111;border:1px solid #292929;border-radius:14px 14px 0 0;overflow:hidden;z-index:80;box-shadow:0 -8px 28px rgba(0,0,0,.45)}
.convogram-emoji-panel .EmojiPickerReact{width:100%!important;height:100%!important}
'''
          css_path.write_text(css)
          p.write_text(s)
          PY
      - name: Validate build
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Commit source change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json src/components/MessagesPanelOriginal.jsx src/components/MessagesPanel.css
          git commit -m 'Upgrade WhatsApp emoji panel' || exit 0
          git push
      - name: Remove one-time workflow
        if: success()
        run: |
          git rm .github/workflows/upgrade-whatsapp-emoji.yml
          git commit -m 'Remove emoji upgrade workflow'
          git push
