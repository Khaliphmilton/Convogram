name: repair-chat-loader
on:
  push:
    branches: [main]

jobs:
  repair:
    if: github.event.head_commit.message != 'Fix chat opening and message loading'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch chat loader
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/components/MessagesPanel.jsx')
          s=p.read_text()
          old='''  async function loadConversation(id) { if (!id) return; setDetails(null); setMessages([]); setRemoteOnline(false); setLastOutgoingRead(false); setError(""); try { const [conversation, conversationMessages] = await Promise.all([getConversationDetails(id), getMessages(id, 100)]); if (!conversation) throw new Error("Conversation could not be found."); const remoteMember = conversation?.conversation_members?.find(member => member.user_id !== userId); if (remoteMember?.user_id) { const { data: remoteProfile } = await supabase.from("profiles").select("id, username, display_name, avatar_url, is_verified").eq("id", remoteMember.user_id).maybeSingle(); if (remoteProfile) conversation.conversation_members = conversation.conversation_members.map(member => member.user_id === remoteMember.user_id ? { ...member, profiles: remoteProfile } : member); } const orderedMessages = [...(conversationMessages || [])].sort((a, b) => new Date(a.created_at || 0).getTime() - new Date(b.created_at || 0).getTime()); setDetails(conversation); setMessages(orderedMessages); for (const message of orderedMessages) if (message.sender_id !== userId && !message.is_deleted) markMessageAsRead(message.id, userId).catch(() => {}); } catch (err) { setError(err.message || "Unable to open conversation."); setSelectedId(null); } }'''
          new='''  async function loadConversation(id) {
    if (!id || !userId) return;
    setDetails(null); setMessages([]); setRemoteOnline(false); setLastOutgoingRead(false); setError("");
    const withTimeout = (promise, ms = 12000) => Promise.race([promise, new Promise((_, reject) => setTimeout(() => reject(new Error("Chat took too long to load. Please try again.")), ms))]);
    try {
      const conversation = await withTimeout(getConversationDetails(id));
      if (!conversation) throw new Error("Conversation could not be found.");
      const remoteMember = conversation?.conversation_members?.find(member => member.user_id !== userId);
      if (remoteMember?.user_id) {
        const { data: remoteProfile } = await supabase.from("profiles").select("id, username, display_name, avatar_url, is_verified").eq("id", remoteMember.user_id).maybeSingle();
        if (remoteProfile) conversation.conversation_members = conversation.conversation_members.map(member => member.user_id === remoteMember.user_id ? { ...member, profiles: remoteProfile } : member);
      }
      setDetails(conversation);
      try {
        const conversationMessages = await withTimeout(getMessages(id, 100, userId));
        const orderedMessages = [...(conversationMessages || [])].sort((a, b) => new Date(a.created_at || 0).getTime() - new Date(b.created_at || 0).getTime());
        setMessages(orderedMessages);
        for (const message of orderedMessages) if (message.sender_id !== userId && !message.is_deleted) markMessageAsRead(message.id, userId).catch(() => {});
      } catch (messageError) {
        setError(messageError?.message || "Messages could not be loaded.");
      }
    } catch (err) {
      setError(err?.message || "Unable to open conversation."); setSelectedId(null);
    }
  }'''
          if old not in s: raise SystemExit('Expected chat loader not found')
          p.write_text(s.replace(old,new,1))
          PY
          rm -f .github/workflows/repair-chat-loader.yml
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/MessagesPanel.jsx .github/workflows/repair-chat-loader.yml
          git diff --cached --quiet || git commit -m 'Fix chat opening and message loading'
          git push
