name: Fix unread badge layout
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'Fix unread badge layout') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply CSS
        run: |
          printf '\n/* Unread badge positioning */\n.conversation-item{position:relative;padding-right:54px}\n.conversation-copy{position:relative;flex:1;min-width:0;overflow:visible}\n.conversation-copy strong{padding-right:28px}\n.conversation-item .convogram-unread-message-badge{position:absolute!important;right:14px!important;top:50%!important;transform:translateY(-50%)!important;margin:0!important;z-index:2}\nbutton:has(> .convogram-unread-message-badge){position:relative!important}\nbutton:has(> .convogram-unread-message-badge)>.convogram-unread-message-badge{position:absolute!important;top:3px!important;left:7px!important;right:auto!important;margin:0!important;z-index:5}\n' >> src/components/MessagesPanel.css
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/MessagesPanel.css
          git commit -m 'Fix unread badge layout' || exit 0
          git push
