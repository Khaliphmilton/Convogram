name: repair-chat-render
on:
  push:
    branches: [main]
jobs:
  repair:
    if: github.event.head_commit.message != 'Repair chat render crash'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Repair chat render crash
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/MessagesPanel.jsx')
          s = p.read_text()
          marker = '  const latestOutgoing = [...messages].reverse().find(message => message.sender_id === userId && !message.is_deleted);'
          if marker not in s:
              raise SystemExit('chat marker not found')
          if 'async function handleSend(' not in s:
              helpers = r'''  async function handleSend(e) {
    e?.preventDefault?.();
    const text = draft.trim();
    if (!selectedId || !userId || !text || sending) return;
    try {
      setSending(true); setError("");
      const sent = await sendMessage(selectedId, userId, text, "text", null, replyingTo?.id || null);
      setMessages(current => current.some(item => item.id === sent.id) ? current : [...current, sent].sort((a,b) => new Date(a.created_at || 0) - new Date(b.created_at || 0)));
      setDraft(""); setReplyingTo(null); updateTyping(false);
    } catch (err) { setError(err?.message || "Message could not be sent."); }
    finally { setSending(false); }
  }
  function startLongPress(id) { clearTimeout(longPressTimerRef.current); longPressTimerRef.current = setTimeout(() => setReactionMessageId(id), LONG_PRESS_MS); }
  function cancelLongPress() { clearTimeout(longPressTimerRef.current); }
  async function toggleReaction(item, reaction) {
    if (!userId || !item?.id) return;
    try {
      const existing = (item.message_reactions || []).find(r => r.user_id === userId && r.reaction === reaction);
      if (existing) await removeMessageReaction(item.id, userId, reaction);
      else await addMessageReaction(item.id, userId, reaction);
      setReactionMessageId(null);
      const refreshed = await getMessages(selectedId, 100, userId);
      setMessages(refreshed || []);
    } catch (err) { setError(err?.message || "Reaction could not be updated."); }
  }
  async function handleDelete(item) {
    if (!item?.id) return;
    try {
      await deleteMessage(item.id);
      setMessages(current => current.map(message => message.id === item.id ? { ...message, is_deleted: true, content: null, media_url: null } : message));
      setReactionMessageId(null);
    } catch (err) { setError(err?.message || "Message could not be deleted."); }
  }
  async function handleMedia(e) {
    const file = e.target.files?.[0]; e.target.value = "";
    if (!file || !selectedId || !userId) return;
    try {
      setUploading(true); setError("");
      const uploaded = await uploadMessageMedia(file, userId);
      const sent = await sendMessage(selectedId, userId, "", uploaded.mediaType, uploaded.url, replyingTo?.id || null);
      setMessages(current => [...current, sent].sort((a,b) => new Date(a.created_at || 0) - new Date(b.created_at || 0)));
      setReplyingTo(null);
    } catch (err) { setError(err?.message || "Media could not be sent."); }
    finally { setUploading(false); }
  }
  async function startRecording() {
    if (!selectedId || !userId || recording || !navigator.mediaDevices?.getUserMedia) { setError("Microphone recording is not available on this device."); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const mime = MediaRecorder.isTypeSupported?.("audio/webm;codecs=opus") ? "audio/webm;codecs=opus" : "audio/webm";
      const recorder = new MediaRecorder(stream, { mimeType: mime });
      chunksRef.current = []; recorderRef.current = recorder; setRecording(true);
      recorder.ondataavailable = event => { if (event.data?.size) chunksRef.current.push(event.data); };
      recorder.onstop = async () => {
        stream.getTracks().forEach(track => track.stop());
        try {
          setUploading(true); const blob = new Blob(chunksRef.current, { type: recorder.mimeType || "audio/webm" });
          const file = new File([blob], `voice-${Date.now()}.webm`, { type: blob.type || "audio/webm" });
          const uploaded = await uploadVoiceMessage(file, userId);
          const sent = await sendMessage(selectedId, userId, "", "audio", uploaded.url, replyingTo?.id || null);
          setMessages(current => [...current, sent].sort((a,b) => new Date(a.created_at || 0) - new Date(b.created_at || 0)));
          setReplyingTo(null);
        } catch (err) { setError(err?.message || "Voice message could not be sent."); }
        finally { setUploading(false); }
      };
      recorder.start();
    } catch (err) { setRecording(false); setError(err?.message || "Microphone permission is required for voice messages."); }
  }
  function stopRecording() { const recorder = recorderRef.current; if (recorder && recorder.state !== "inactive") { setRecording(false); recorder.stop(); } }
  async function handleCreateChat(e) {
    e?.preventDefault?.(); const member = newMemberId.trim();
    if (!member || !userId) return;
    try { setError(""); const conversation = await createConversation(userId, "direct", null, null, [member]); setNewChatOpen(false); setNewMemberId(""); await loadConversations(); if (conversation?.id) setSelectedId(conversation.id); }
    catch (err) { setError(err?.message || "Could not create chat."); }
  }
'''
              s = s.replace(marker, helpers + '\n' + marker, 1)
          # The existing repair workflow added a boundary only when it sees this class; add one now if still absent.
          if 'class MessagesPanelErrorBoundary' not in s:
              s = s.replace('import { useEffect, useMemo, useRef, useState } from "react";', 'import { Component, useEffect, useMemo, useRef, useState } from "react";', 1)
              boundary_marker = 'const REACTIONS = ["❤️", "😂", "👍", "🔥", "😮", "😢"];'
              boundary = r'''class MessagesPanelErrorBoundary extends Component {
  constructor(props) { super(props); this.state = { hasError: false, message: "" }; }
  static getDerivedStateFromError(error) { return { hasError: true, message: error?.message || "The chat could not be displayed." }; }
  componentDidCatch(error) { console.error("Convogram chat render error", error); }
  render() {
    if (!this.state.hasError) return this.props.children;
    return <div className="messages-panel chat-render-error"><div className="chat-render-error-card"><strong>Chat could not be displayed</strong><span>{this.state.message}</span><button type="button" onClick={() => window.location.reload()}>Reload chat</button></div></div>;
  }
}

'''
              if boundary_marker not in s: raise SystemExit('reaction marker not found')
              s = s.replace(boundary_marker, boundary + boundary_marker, 1)
              s = s.replace('export function MessagesPanel({ userId, initialConversationId = null, onBack }) {', 'function MessagesPanelContent({ userId, initialConversationId = null, onBack }) {', 1)
              s += '\n\nexport function MessagesPanel(props) {\n  return <MessagesPanelErrorBoundary><MessagesPanelContent {...props} /></MessagesPanelErrorBoundary>;\n}\n'
          p.write_text(s)
          c = Path('src/components/MessagesPanel.css')
          css = c.read_text()
          if '.chat-render-error' not in css:
              css += '\n.chat-render-error{display:flex;align-items:center;justify-content:center;min-height:100%;padding:24px;background:#080808}.chat-render-error-card{display:flex;flex-direction:column;gap:10px;max-width:360px;padding:22px;border:1px solid rgba(120,150,255,.28);border-radius:18px;background:#111722;color:#fff}.chat-render-error-card span{color:#aeb8c8;font-size:13px;word-break:break-word}.chat-render-error-card button{border:0;border-radius:10px;padding:11px 14px;background:#3d7eff;color:#fff;font-weight:700}\n'
              c.write_text(css)
          PY
      - name: Validate build
        run: |
          npm ci
          npm run build
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/MessagesPanel.jsx src/components/MessagesPanel.css
          git diff --cached --quiet || git commit -m 'Repair chat render crash'
          git push
