<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#071426" />
    <meta name="description" content="Convogram — Connect, chat, share, create and discover." />
    <link rel="icon" type="image/svg+xml" href="/convogram-icon.svg" />
    <link rel="apple-touch-icon" href="/convogram-icon.svg" />
    <link rel="stylesheet" href="/src/post-composer-organization.css" />
    <link rel="stylesheet" href="/src/topbar-organization.css" />
    <link rel="stylesheet" href="/src/splash-branding.css" />
    <link rel="stylesheet" href="/src/android-safe-area.css" />
    <link rel="stylesheet" href="/src/chat-bottom-fix.css" />
    <link rel="stylesheet" href="/src/community-management.css" />
    <style>
      #convogram-splash{position:fixed;inset:0;z-index:99999;background:#071426;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;transition:opacity .35s ease,visibility .35s ease}
      #convogram-splash.hide{opacity:0;visibility:hidden;pointer-events:none}
      #convogram-splash .splash-icon{width:82px;height:82px;border-radius:24px;box-shadow:0 20px 60px rgba(0,0,0,.3);margin-bottom:18px}
      #convogram-splash h1{margin:0;font-size:30px;letter-spacing:-.04em;font-weight:800}
      #convogram-splash .company{position:absolute;bottom:48px;font-size:12px;font-weight:800;letter-spacing:.24em;color:rgba(255,255,255,.72)}
      #convogram-splash .tagline{position:absolute;bottom:27px;font-size:9px;letter-spacing:.12em;color:rgba(255,255,255,.34)}

      /* Emoji picker layout fix: size the outer panel, then let emoji-picker-react
         manage its own responsive grid. Do not replace its internal list layout. */
      .messages-panel.chat-open .convogram-emoji-panel{
        position:absolute!important;
        left:10px!important;
        right:10px!important;
        bottom:calc(100% + 8px)!important;
        width:auto!important;
        max-width:none!important;
        height:min(360px,52vh)!important;
        min-height:240px!important;
        padding:0!important;
        box-sizing:border-box!important;
        display:block!important;
        overflow:hidden!important;
        z-index:80!important;
      }
      .messages-panel.chat-open .convogram-emoji-panel .EmojiPickerReact,
      .messages-panel.chat-open .convogram-emoji-panel aside.EmojiPickerReact{
        width:100%!important;
        max-width:none!important;
        min-width:0!important;
        height:100%!important;
        min-height:0!important;
        box-sizing:border-box!important;
        --epr-emoji-size:30px;
        --epr-emoji-padding:4px;
        --epr-horizontal-padding:8px;
        --epr-picker-border-radius:14px;
      }
      .messages-panel.chat-open .convogram-emoji-panel .epr-main,
      .messages-panel.chat-open .convogram-emoji-panel .epr-body,
      .messages-panel.chat-open .convogram-emoji-panel .epr-emoji-category-content{
        width:100%!important;
        max-width:none!important;
        min-width:0!important;
        box-sizing:border-box!important;
      }
      .messages-panel.chat-open .convogram-emoji-panel .epr-body{
        overflow-x:hidden!important;
      }
      @media(max-width:420px){
        .messages-panel.chat-open .convogram-emoji-panel{
          left:6px!important;
          right:6px!important;
          height:min(340px,50vh)!important;
          min-height:220px!important;
        }
        .messages-panel.chat-open .convogram-emoji-panel .EmojiPickerReact,
        .messages-panel.chat-open .convogram-emoji-panel aside.EmojiPickerReact{
          --epr-emoji-size:28px;
          --epr-emoji-padding:3px;
          --epr-horizontal-padding:6px;
        }
      }
    </style>
    <title>Convogram</title>
  </head>
  <body>
    <div id="convogram-splash" aria-label="Khaliph Industries — Convogram">
      <img class="splash-icon" src="/convogram-icon.svg" alt="Convogram" />
      <h1>Convogram</h1>
      <div class="company">KHALIPH INDUSTRIES</div>
      <div class="tagline">TECHNOLOGY • SOCIAL • COMMUNITY</div>
    </div>
    <div id="root"></div>
    <script>
      window.addEventListener("popstate", (event) => {
        if (typeof window.__convogramChatBack === "function") {
          const handled = window.__convogramChatBack(event);
          if (handled) event.stopImmediatePropagation();
        }
      }, true);
      window.setTimeout(() => document.getElementById("convogram-splash")?.classList.add("hide"), 2200);
    </script>
    <script type="module" src="/src/chat-back-fix.js"></script>
    <script type="module" src="/src/moment-back-fix.js"></script>
    <script type="module" src="/src/media-picker-flow.js"></script>
    <script type="module" src="/src/post-composer-enhancer.js"></script>
    <script type="module" src="/src/message-swipe-reply.js"></script>
    <script type="module" src="/src/conversation-previews.js"></script>
    <script type="module" src="/src/permissions-bootstrap.js"></script>
    <script type="module" src="/src/push-bootstrap.js"></script>
    <script type="module" src="/src/call-button-bridge.js"></script>
    <script type="module" src="/src/typing-indicator.js"></script>
    <script type="module" src="/src/read-receipt-enhancer.js"></script>
    <script type="module" src="/src/call-overlay-bootstrap.jsx"></script>
    <script type="module" src="/src/community-management-bridge.js"></script>
    <script type="module" src="/src/update-checker.js"></script>
    <script type="module" src="/src/main.jsx"></script>
    <script type="module" src="/src/chat-status-bar-fix.js"></script>
  </body>
</html>
